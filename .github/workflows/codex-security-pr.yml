name: Codex Security Mock CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  security:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CS_RESULTS: ${{ runner.temp }}/codex-security-mock
      ENFORCE_POLICY: "false"

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run synthetic security scan
        id: scan
        shell: bash
        run: |
          set +e
          npx --yes @openai/codex-security@0.8.2 scan . \
            --diff "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --mock \
            --headless \
            --json \
            --output-dir "$CS_RESULTS" \
            --fail-on-severity high \
            > "$RUNNER_TEMP/mock-scan.json"
          rc=$?
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Scanner exit code: $rc"

          if (( rc != 0 && rc != 1 )); then
            exit "$rc"
          fi

      - name: Inspect findings and export SARIF
        if: ${{ steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '1' }}
        run: |
          npx --yes @openai/codex-security@0.8.2 export \
            "$CS_RESULTS" \
            --source-root . \
            --output "$RUNNER_TEMP/mock-results.sarif"

          jq -e '(.findings | length) == 12' \
            "$CS_RESULTS/findings.json"

          jq -e '.version == "2.1.0" and (.runs | type == "array")' \
            "$RUNNER_TEMP/mock-results.sarif"

          jq '[.findings[].severity.level] | group_by(.) | map({
            severity: .[0],
            count: length
          })' "$CS_RESULTS/findings.json"

      - name: Upload mock artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-security-mock-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-security-mock/findings.json
            ${{ runner.temp }}/codex-security-mock/scan-manifest.json
            ${{ runner.temp }}/codex-security-mock/report.md
            ${{ runner.temp }}/mock-results.sarif
            ${{ runner.temp }}/mock-scan.json
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce security policy
        if: ${{ env.ENFORCE_POLICY == 'true' }}
        run: |
          test "${{ steps.scan.outputs.exit_code }}" = "0"
